<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 6 To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <header>
        <p class="eyebrow">to-do list</p>
        <h1>Task Manager</h1>
        <p class="muted">
          Organize your tasks and stay productive. Add, complete, and manage your to-dos.
        </p>
      </header>

      <div class="todo-area">
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="totalTasks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active</span>
            <span class="stat-value" id="activeTasks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Completed</span>
            <span class="stat-value" id="completedTasks">0</span>
          </div>
        </div>

        <div class="add-task-section">
          <div class="input-group">
            <input
              type="text"
              id="taskInput"
              class="input"
              placeholder="What needs to be done?"
              aria-label="Enter new task"
            />
            <button id="addTaskBtn" class="btn btn--primary">Add Task</button>
          </div>
        </div>

        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="tasks-container">
          <ul class="tasks-list" id="tasksList" role="list">
            <li class="empty-state" id="emptyState">
              <p>No tasks yet. Add a task to get started!</p>
            </li>
          </ul>
        </div>

        <div class="actions-bar" id="actionsBar" style="display: none;">
          <button id="clearCompletedBtn" class="btn btn--ghost">Clear Completed</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
