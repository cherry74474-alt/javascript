<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 2 Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator">
      <header>
        <p class="eyebrow">calculator</p>
        <h1>Simple Calculator</h1>
        <p class="muted">
          Type numbers or use the buttons to perform basic arithmetic.
        </p>
      </header>

      <div class="display" aria-live="polite">
        <div class="history" id="history"></div>
        <div class="current" id="display">0</div>
      </div>

      <div class="keypad" role="group" aria-label="Calculator keypad">
        <button data-action="clear" class="key key--function">AC</button>
        <button data-action="sign" class="key key--function">±</button>
        <button data-action="percent" class="key key--function">%</button>
        <button data-action="divide" class="key key--operator">÷</button>

        <button data-value="7" class="key">7</button>
        <button data-value="8" class="key">8</button>
        <button data-value="9" class="key">9</button>
        <button data-action="multiply" class="key key--operator">×</button>

        <button data-value="4" class="key">4</button>
        <button data-value="5" class="key">5</button>
        <button data-value="6" class="key">6</button>
        <button data-action="subtract" class="key key--operator">−</button>

        <button data-value="1" class="key">1</button>
        <button data-value="2" class="key">2</button>
        <button data-value="3" class="key">3</button>
        <button data-action="add" class="key key--operator">+</button>

        <button data-value="0" class="key key--zero">0</button>
        <button data-value="." class="key">.</button>
        <button data-action="equals" class="key key--operator">=</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
